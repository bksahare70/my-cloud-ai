<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | MY CLOUD AI</title><link rel="stylesheet" href="platform.css"><script src="config.js"></script><script src="cloud-client.js" defer></script></head><body><header><h1>☁️ MY CLOUD AI</h1><nav><a href="index.html">Dashboard</a><a href="My-Files.html">My Files</a><a href="GPU-Cloud.html">GPU Cloud</a></nav></header><main><section class="panel"><h2>Login</h2><p id="status" class="notice">Connect your own Supabase project using SETUP-GUIDE.txt to enable accounts.</p><form id="auth"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Login</button></form><p>New here? <a href="Signup.html">Create an account</a></p><p><a href="index.html">Back to Dashboard</a></p></section></main><script>
const form=document.getElementById('auth'), statusBox=document.getElementById('status');
function ready(){return window.MY_CLOUD?.client}
document.addEventListener('mycloud-ready',()=>{statusBox.textContent='Cloud connection ready. You can use your account.'});
form.addEventListener('submit',async e=>{e.preventDefault();const sb=ready();if(!sb){statusBox.textContent='Not connected yet. Complete the Supabase setup guide first.';return}
const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
try{
const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; statusBox.textContent='Login successful. Opening your files…'; location.href='My-Files.html';
}catch(err){statusBox.textContent=err.message||'Request failed.'}
});
</script></body></html>
