<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14285a"><title>Profile | MY CLOUD AI</title><link rel="stylesheet" href="platform.css"><script src="config.js"></script><script src="cloud-client.js" defer></script>
<style>.panel{max-width:720px;margin:20px auto}.muted{color:#64748b}#status{overflow-wrap:anywhere}button:disabled{opacity:.55;cursor:not-allowed}</style></head><body><header><h1>👤 MY CLOUD AI — Profile</h1><nav><a href="index.html">Dashboard</a><a href="My-Files.html">My Files</a><a href="Settings.html">Settings</a><a href="Login.html">Login</a></nav></header>
<main><section class="panel"><h2>Account information</h2><p id="status" class="notice" role="status" aria-live="polite">Checking cloud connection…</p><p><b>Email:</b> <span id="email">—</span></p><p><b>User ID:</b> <span id="uid">—</span></p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="button" href="My-Files.html">Open My Files</a><button id="logout" type="button" disabled>Sign out</button></div><p class="muted">This page displays the signed-in Supabase account only. It does not store passwords or create a separate profile database.</p></section></main>
<script>
(()=>{const status=document.getElementById('status'),email=document.getElementById('email'),uid=document.getElementById('uid'),logout=document.getElementById('logout');let sb=null;async function load(){sb=window.MY_CLOUD&&window.MY_CLOUD.client;if(!sb){status.textContent='Cloud connection is not ready. Check your internet connection and Supabase setup, then reload.';return}try{const {data,error}=await sb.auth.getUser();if(error)throw error;if(!data.user){status.textContent='You are not signed in. Please log in to view your account.';email.textContent='Not signed in';uid.textContent='—';logout.disabled=true;return}email.textContent=data.user.email||'Email unavailable';uid.textContent=data.user.id;status.textContent='Account connected.';logout.disabled=false}catch(e){status.textContent=e.message||'Could not load account information.'}}document.addEventListener('mycloud-ready',load);if(window.MY_CLOUD&&window.MY_CLOUD.client)load();logout.addEventListener('click',async()=>{if(!sb)return;logout.disabled=true;try{const {error}=await sb.auth.signOut();if(error)throw error;status.textContent='Signed out successfully.';email.textContent='Not signed in';uid.textContent='—';location.href='Login.html'}catch(e){status.textContent=e.message||'Sign out failed.';logout.disabled=false}})})();
</script></body></html>
