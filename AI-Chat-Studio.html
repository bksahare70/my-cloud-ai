
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY CLOUD AI - Chat Studio</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b1220;color:#eaf0ff;font-family:Arial,sans-serif}
    header{padding:18px;background:#111c31;border-bottom:1px solid #263650}
    header h2{margin:0;font-size:21px}
    header p{margin:7px 0 0;color:#9eacc5;font-size:13px}
    #chat{height:calc(100dvh - 160px);overflow-y:auto;padding:16px;max-width:850px;margin:auto}
    .msg{padding:12px 15px;margin:12px 0;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
    .user{background:#2457a7;margin-left:auto}
    .ai{background:#1b2940;margin-right:auto}
    .system{color:#ffcf75;text-align:center;font-size:13px;margin:12px}
    footer{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#111c31;border-top:1px solid #263650}
    .inputrow{display:flex;gap:8px;max-width:850px;margin:auto}
    textarea{flex:1;resize:none;height:48px;border:1px solid #40516d;border-radius:12px;padding:13px;background:#0b1220;color:white;font-size:15px}
    button{border:0;border-radius:12px;padding:0 19px;background:#3978e8;color:white;font-weight:bold;font-size:15px}
    button:disabled{opacity:.5}
    .hint{max-width:850px;margin:7px auto 0;color:#8292ad;font-size:11px}
  </style>
</head>
<body>
  <header>
    <h2>🤖 MY CLOUD AI — Chat Studio</h2>
    <p>Powered by Gemini AI</p>
  </header>

  <main id="chat">
    <div class="msg ai">नमस्ते! 👋 मैं MY CLOUD AI हूँ। आप मुझसे हिंदी या English में कुछ भी पूछ सकते हैं।</div>
  </main>

  <footer>
    <div class="inputrow">
      <textarea id="message" placeholder="अपना सवाल लिखें..." rows="1"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Enter = Send · Shift + Enter = नई लाइन</div>
  </footer>

  <script src="./config.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    const FUNCTION_URL =
      "https://qxmgcywzdzbfrhmcdclf.supabase.co/functions/v1/gemini-chat";

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || send.disabled) return;

      const config = window.MY_CLOUD_CONFIG;
      if (!config || !config.supabaseAnonKey) {
        addMessage("Error: config.js या Supabase configuration नहीं मिली।", "system");
        return;
      }

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";
      const waiting = addMessage("AI जवाब तैयार कर रहा है...", "ai");

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": config.supabaseAnonKey
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.message || ("HTTP " + response.status));
        }
        if (!data.success || !data.reply) {
          throw new Error(data.error || "AI से जवाब नहीं मिला।");
        }
        waiting.textContent = data.reply;
      } catch (error) {
        waiting.textContent = "समस्या: " + error.message +
          "\nकृपया इंटरनेट या Supabase Function configuration जाँचें।";
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
