<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Hub | MY CLOUD AI</title><style>*{box-sizing:border-box}body{margin:0;padding:20px 14px;font:16px/1.55 system-ui;background:#0b1224;color:#eef4ff;max-width:850px;margin:auto}a{color:#8ab4ff}.panel{background:#121d35;border:1px solid #293957;border-radius:12px;padding:16px;margin:14px 0}label{display:block;padding:10px 0}input{margin-right:8px}small,.muted{color:#aab8d0}button{padding:10px 14px;border-radius:9px;border:1px solid #52627e;background:#1b2b49;color:white}</style></head><body><h1>🔁 Automation Hub</h1><p>Plan and track your workflows from one place.</p><p><a href="index.html">⌂ Home</a> · <a href="AI-Workspace.html">AI Workspace</a> · <a href="AI-Prompt-Studio.html">Prompt Studio</a></p><div class="panel"><b>Workflow checklist</b><p class="muted">This is a browser-local checklist. It saves checked items on this device; it does not run tasks in the background, access accounts, or automate external websites.</p><label><input type="checkbox" data-task="prompt"> Prepare prompt in Prompt Studio</label><label><input type="checkbox" data-task="provider"> Open the selected AI provider</label><label><input type="checkbox" data-task="review"> Review generated output</label><label><input type="checkbox" data-task="save"> Save final files to My Files</label><label><input type="checkbox" data-task="backup"> Verify backup is available</label><button id="reset" type="button">Reset checklist</button><p id="status" class="muted" role="status" aria-live="polite"></p></div><script>(()=>{const items=[...document.querySelectorAll('[data-task]')],status=document.getElementById('status');const key='mycloud-automation-checklist';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}items.forEach(x=>{x.checked=!!saved[x.dataset.task];x.addEventListener('change',()=>{saved[x.dataset.task]=x.checked;try{localStorage.setItem(key,JSON.stringify(saved));status.textContent='Checklist saved on this device.'}catch(e){status.textContent='Browser storage unavailable; checklist may not persist.'}})});document.getElementById('reset').addEventListener('click',()=>{items.forEach(x=>x.checked=false);saved={};try{localStorage.removeItem(key)}catch(e){}status.textContent='Checklist reset.'})})();</script></body></html>
