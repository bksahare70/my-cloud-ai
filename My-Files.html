<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Files | MY CLOUD AI</title><link rel="stylesheet" href="platform.css"><script src="config.js"></script><script src="cloud-client.js" defer></script></head><body><header><h1>☁️ MY CLOUD AI — My Files</h1><nav><a href="index.html">Dashboard</a><a href="GPU-Cloud.html">GPU Cloud</a><a href="Settings.html">Settings</a><a href="#" id="logout">Logout</a></nav></header><main><section class="panel"><h2>Private File Storage</h2><p class="notice" id="status">Storage requires your own Supabase project and the SQL setup in SETUP-GUIDE.txt.</p><div id="app" hidden><p id="who"></p><input type="file" id="file"><button id="upload">Upload file</button><h3>Your files</h3><div id="list"></div></div><p><a href="Login.html">Login</a> · <a href="Signup.html">Create account</a></p></section></main><script>
const statusBox=document.getElementById('status'),app=document.getElementById('app'),list=document.getElementById('list');
function safeName(n){return n.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-100)}
async function init(){const sb=window.MY_CLOUD?.client;if(!sb){statusBox.textContent='Not connected. Follow SETUP-GUIDE.txt and fill config.js.';return}
const {data:{user}}=await sb.auth.getUser();if(!user){statusBox.textContent='Please login to view your private files.';return}
app.hidden=false;document.getElementById('who').textContent='Signed in: '+user.email;statusBox.textContent='Connected. Files are stored in your private user folder.';await refresh()}
async function refresh(){const sb=window.MY_CLOUD.client,bucket=window.MY_CLOUD_CONFIG.storageBucket;const user=(await sb.auth.getUser()).data.user;const {data,error}=await sb.storage.from(bucket).list(user.id,{limit:100,sortBy:{column:'name',order:'asc'}});if(error){statusBox.textContent=error.message;return}list.innerHTML='';(data||[]).forEach(f=>{const row=document.createElement('div');row.className='file';const name=document.createElement('span');name.textContent=f.name;const actions=document.createElement('span');const dl=document.createElement('button');dl.textContent='Download';dl.onclick=async()=>{const {data,error}=await sb.storage.from(bucket).download(user.id+'/'+f.name);if(error){statusBox.textContent=error.message;return}const url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=f.name;a.click();URL.revokeObjectURL(url)};const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+f.name+'?'))return;const {error}=await sb.storage.from(bucket).remove([user.id+'/'+f.name]);statusBox.textContent=error?error.message:'File deleted.';refresh()};actions.append(dl,del);row.append(name,actions);list.append(row)})}
document.addEventListener('mycloud-ready',init);
document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return statusBox.textContent='Choose a file first.';const sb=window.MY_CLOUD.client,user=(await sb.auth.getUser()).data.user;if(!user)return;const path=user.id+'/'+Date.now()+'-'+safeName(f.name);const {error}=await sb.storage.from(window.MY_CLOUD_CONFIG.storageBucket).upload(path,f,{upsert:false});statusBox.textContent=error?error.message:'Uploaded successfully.';refresh()};
document.getElementById('logout').onclick=async e=>{e.preventDefault();if(window.MY_CLOUD?.client){await window.MY_CLOUD.client.auth.signOut()}location.href='Login.html'};
</script></body></html>
